[project]
name = "stickfighter"
version = "0.1.0"
description = "Stickman archery duel game with a self-play-trained AI"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["stickfighter/tests"]
addopts = "-m \"not slow\""
markers = [
    "slow: integration tests that train briefly (select with '-m slow')",
]

[tool.setuptools.packages.find]
include = ["stickfighter*"]
